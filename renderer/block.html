<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>המחשב חסום</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* משתני ערכת נושא — נקבעים לפי data-theme על ה-html (מסך החסימה מקבל אותה מהסטטוס) */
    :root {
      --b-bg: #0a0a14;
      --b-panel: rgba(20, 20, 40, 0.62);
      --b-border: rgba(255, 255, 255, 0.1);
      --b-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --b-title: linear-gradient(135deg, #fff, #fda4af);
      --b-count-bg: rgba(255, 255, 255, 0.05);
      --b-input-bg: rgba(255, 255, 255, 0.05);
      --b-blob-opacity: 0.65;
      /* טוקנים גלובליים שהמסך משתמש בהם — מוגדרים כאן כדי שהמסך
         יהיה עצמאי לחלוטין ולא תלוי ב-styles.css (אותם ערכים) */
      --text: #f2f3ff;
      --muted: #9aa0c3;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #7b6bff;
      --accent-2: #a78bfa;
      --red: #fb7185;
    }
    :root[data-theme='light'] {
      --b-bg: #eef0f9;
      --b-panel: rgba(255, 255, 255, 0.82);
      --b-border: rgba(23, 26, 70, 0.12);
      --b-shadow: 0 30px 80px rgba(40, 45, 110, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      --b-title: linear-gradient(135deg, #1b1d33, #e04257);
      --b-count-bg: rgba(23, 26, 70, 0.05);
      --b-input-bg: rgba(255, 255, 255, 0.92);
      --b-blob-opacity: 0.35;
      --text: #1b1d33;
      --muted: #62668f;
      --border: rgba(23, 26, 70, 0.1);
      --border-strong: rgba(23, 26, 70, 0.18);
      --accent: #6358f0;
      --accent-2: #7c5cf0;
      --red: #e04257;
    }
    body {
      min-height: 100vh;
      display: grid; place-items: center;
      background: var(--b-bg);
      user-select: none;
      overflow: hidden;
      font-family: "Heebo", "Segoe UI", "Arial Hebrew", system-ui, sans-serif;
      transition: background 0.4s ease;
    }
    /* רקע חי: כתמי אור נעים — צבעים עזים וברורים (לא דוהים), נעים באיטיות */
    .bg-blob {
      position: fixed; border-radius: 50%;
      filter: blur(62px);
      opacity: var(--b-blob-opacity);
      z-index: 0; pointer-events: none;
      will-change: transform, opacity;
      transition: opacity 0.4s ease;
    }
    .blob-1 { width: 620px; height: 620px; top: -200px; right: -140px;
      background: radial-gradient(circle, rgba(251, 113, 133, 0.8) 0%, rgba(251, 113, 133, 0.22) 45%, transparent 70%);
      animation: drift1 15s ease-in-out infinite alternate; }
    .blob-2 { width: 560px; height: 560px; bottom: -180px; left: -140px;
      background: radial-gradient(circle, rgba(123, 107, 255, 0.78) 0%, rgba(123, 107, 255, 0.2) 45%, transparent 70%);
      animation: drift2 18s ease-in-out infinite alternate; }
    .blob-3 { width: 420px; height: 420px; top: 34%; left: 14%;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.55) 0%, rgba(52, 211, 153, 0.14) 45%, transparent 70%);
      animation: drift3 21s ease-in-out infinite alternate; }
    .blob-4 { width: 380px; height: 380px; bottom: 6%; right: 10%;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.5) 0%, rgba(244, 114, 182, 0.12) 45%, transparent 70%);
      animation: drift4 24s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(70px, 60px) scale(1.1); } }
    @keyframes drift2 { to { transform: translate(-60px, -50px) scale(1.12); } }
    @keyframes drift3 { to { transform: translate(40px, -60px) scale(1.14); } }
    @keyframes drift4 { to { transform: translate(-50px, 40px) scale(1.08); } }

    .block-screen {
      position: relative; z-index: 1;
      text-align: center; max-width: 480px; padding: 34px 30px;
      box-sizing: border-box; /* הגובה המרבי כולל את הריפוד — לא תלוי ב-styles.css */
      background: var(--b-panel);
      border: 1px solid var(--b-border);
      border-radius: 28px;
      backdrop-filter: blur(18px) saturate(1.15);
      box-shadow: var(--b-shadow);
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
      /* על מסכים נמוכים החלונית נכנסת תמיד בתוך המסך עם פס גלילה פנימי,
         כך שכל הכפתורים (כולל בחירת הרקע) נגישים */
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .block-screen::-webkit-scrollbar { width: 8px; }
    .block-screen::-webkit-scrollbar-track { background: transparent; }
    .block-screen::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    /* מזעור החלונית — הרקע לבדו במסך מלא. הכפתור מקובע לפינת המסך כך
       שהוא נשאר נגיש גם כשהחלונית גדולה מהמסך וצריך לגלול בתוכה. */
    .minimize-btn {
      position: fixed; top: 14px; inset-inline-start: 14px; z-index: 6;
      width: 32px; height: 32px;
      display: grid; place-items: center;
      background: var(--b-panel);
      border: 1px solid var(--border-strong);
      color: var(--muted); border-radius: 50%;
      cursor: pointer; font-family: inherit;
      opacity: 0.6;
      backdrop-filter: blur(12px) saturate(1.15);
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    }
    .minimize-btn:hover { opacity: 1; color: var(--text); border-color: var(--accent); background: rgba(123, 107, 255, 0.12); }
    .minimize-btn .icon { width: 15px; height: 15px; }
    body.block-minimized .minimize-btn { display: none; }
    body.block-minimized .block-screen { display: none; }
    .restore-fab {
      position: fixed; top: 18px; inset-inline-start: 18px;
      z-index: 5;
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--b-panel);
      border: 1px solid var(--b-border);
      border-radius: 999px;
      padding: 9px 16px;
      color: var(--text); font-family: inherit; font-size: 13px; font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(14px) saturate(1.15);
      box-shadow: var(--b-shadow);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .restore-fab:hover { border-color: var(--accent); background: rgba(123, 107, 255, 0.14); }
    .restore-fab .icon { width: 15px; height: 15px; }
    .block-icon {
      width: 116px; height: 116px; margin: 0 auto 24px;
      border-radius: 30px;
      background: linear-gradient(135deg, #fb7185, #e11d48);
      display: grid; place-items: center;
      box-shadow: 0 16px 48px rgba(251, 113, 133, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.3);
      position: relative;
      animation: pulseGlow 2.6s ease-in-out infinite;
    }
    .block-icon .icon { width: 54px; height: 54px; color: #fff; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 16px 48px rgba(251, 113, 133, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.3); }
      50% { box-shadow: 0 20px 64px rgba(251, 113, 133, 0.65), inset 0 2px 0 rgba(255, 255, 255, 0.3); }
    }    .block-title { font-size: 40px; font-weight: 900; letter-spacing: -0.5px;
      background: var(--b-title);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .block-sub { color: var(--muted); font-size: 16px; margin-top: 8px; line-height: 1.6; }
    .block-msg {
      font-size: 16px; font-weight: 600; margin-top: 16px;
      color: #ffd9df;
      line-height: 1.6;
      max-width: 400px; margin-inline: auto;
      font-style: italic;
    }
    .no-pin-note { font-size: 22px; font-weight: 800; margin-top: 22px; color: var(--accent-2, #6ee7b7); }
    .no-pin-sub { color: var(--muted, #94a3b8); font-size: 14px; margin-top: 8px; line-height: 1.7; max-width: 380px; margin-inline: auto; }
    #noPinBox .btn { min-width: 260px; margin-top: 4px; }
    :root[data-theme='light'] .block-msg { color: #a11c2e; }
    /* שלושת השעונים של מסך החסימה: נוכחי / פתיחה / נשאר */
    .clocks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 22px;
    }
    .clock-card {
      background: var(--b-count-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 8px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      transition: background 0.4s ease, border-color 0.4s ease;
    }
    .clock-label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .clock-face { width: 70px; height: 70px; display: block; }
    .clock-face .cf-ring { fill: none; stroke: var(--border-strong); stroke-width: 3; opacity: 0.85; }
    .clock-face .cf-tick { stroke: var(--muted); stroke-width: 1.5; opacity: 0.5; }
    .clock-face .cf-tick.major { stroke-width: 2.3; opacity: 0.95; }
    .clock-face .cf-hand { stroke-linecap: round; }
    .clock-face .cf-hour { stroke: var(--text); stroke-width: 3.4; }
    .clock-face .cf-minute { stroke: var(--accent); stroke-width: 2.3; }
    .clock-face .cf-second { stroke: var(--red); stroke-width: 1.3; }
    .clock-face .cf-cap { fill: var(--text); }
    .clock-value {
      font-size: 16px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--accent-2);
      letter-spacing: 0.4px;
      min-height: 24px;
    }
    /* שורת סטטוס מתחת לשעונים — למקרי קצה (נעילה ידנית, שחרור, ללא הגבלה) */
    .block-count {
      font-size: 14px; font-weight: 600; margin-top: 14px;
      color: var(--muted); min-height: 20px;
    }
    /* משפטי עידוד מחזקים מהמקורות — מתחלפים מדי כמה שניות */
    .torah-quote {
      margin-top: 22px;
      padding: 18px 20px 14px;
      background: var(--b-count-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      position: relative;
    }
    .torah-quote::before {
      content: '❝';
      position: absolute;
      top: 2px;
      inset-inline-start: 12px;
      font-size: 28px;
      line-height: 1;
      color: var(--accent);
      opacity: 0.45;
      pointer-events: none;
    }
    .tq-text {
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.9;
      color: var(--text);
      text-align: center;
    }
    .tq-source {
      margin-top: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--accent-2);
      text-align: center;
      letter-spacing: 0.3px;
    }
    .torah-quote.tq-hidden { display: none; }
    .torah-quote.tq-fade-in { animation: tqFade 0.6s ease; }
    @keyframes tqFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    /* כפתור פתיחה קטן ושקט — שדה הסיסמה מוסתר כברירת מחדל (לחיצה פותחת) */
    .unlock-toggle {
      margin-top: 24px;
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent;
      border: 1px dashed var(--border-strong);
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.2s var(--ease, ease), border-color 0.2s var(--ease, ease), background 0.2s var(--ease, ease);
    }
    .unlock-toggle:hover { color: var(--text); border-color: var(--accent); background: rgba(123, 107, 255, 0.1); }
    .unlock-toggle .icon { width: 15px; height: 15px; }
    .pin-box { margin-top: 26px; }
    .pin-box .text-input {
      width: 210px; text-align: center; font-size: 21px;
      letter-spacing: 7px;
      background: var(--b-input-bg);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 13px;
      color: var(--text);
      font-family: inherit;
      transition: border-color 0.2s var(--ease, ease), box-shadow 0.2s var(--ease, ease), background 0.4s ease;
    }
    .pin-box .text-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(123, 107, 255, 0.25);
    }
    .pin-box .btn { margin-top: 14px; min-width: 210px; }
    .hint-lock {
      color: var(--muted); font-size: 13px; margin-top: 26px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .hint-lock .icon { width: 15px; height: 15px; }
    .lock-msg {
      color: #fda4af; font-size: 14px; margin-top: 16px;
      min-height: 22px; transition: opacity 0.2s;
    }
    .lock-msg.ok { color: var(--accent-2); }
    .shake { animation: shakeX 0.45s ease; }
    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(9px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(5px); }
    }
    .pin-box.locked { opacity: 0.55; pointer-events: none; }
    .lock-count { font-weight: 800; color: #fbbf24; }
    /* ---------- רקעים למסך החסימה ---------- */
    .bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #fluidCanvas, #particleCanvas { width: 100%; height: 100%; display: none; }
    body[data-bg='fluid'] #fluidCanvas, body[data-bg='particles'] #particleCanvas { display: block; pointer-events: auto; }
    body[data-bg='fluid'] .bg-blob, body[data-bg='particles'] .bg-blob, body[data-bg='aurora'] .bg-blob { display: none; }
    /* אורורה זוהרת: וילונות אור נעים במעבר צבעים (CSS בלבד) */
    .aurora-layer { display: none; overflow: hidden; animation: auroraHue 42s linear infinite; }
    body[data-bg='aurora'] .aurora-layer { display: block; }
    .aurora-band {
      position: absolute;
      width: 150%; height: 44%;
      left: -25%;
      border-radius: 50%;
      filter: blur(56px);
      mix-blend-mode: screen;
      opacity: 0.8;
      will-change: transform;
    }
    .aurora-band-1 {
      top: -14%;
      background: linear-gradient(180deg, rgba(52, 211, 153, 0.9), rgba(52, 211, 153, 0.2) 62%, transparent 80%);
      transform: rotate(-10deg);
      animation: auroraBand1 17s ease-in-out infinite alternate;
    }
    .aurora-band-2 {
      top: 3%;
      background: linear-gradient(180deg, rgba(129, 140, 248, 0.95), rgba(123, 107, 255, 0.22) 60%, transparent 80%);
      transform: rotate(8deg);
      animation: auroraBand2 23s ease-in-out infinite alternate;
    }
    .aurora-band-3 {
      top: 15%;
      background: linear-gradient(180deg, rgba(45, 212, 191, 0.85), rgba(56, 189, 248, 0.18) 58%, transparent 78%);
      transform: rotate(-5deg);
      animation: auroraBand3 20s ease-in-out infinite alternate;
    }
    .aurora-band-4 {
      top: 26%;
      background: linear-gradient(180deg, rgba(244, 114, 182, 0.55), transparent 72%);
      transform: rotate(12deg);
      animation: auroraBand4 26s ease-in-out infinite alternate;
    }
    @keyframes auroraBand1 { to { transform: rotate(-16deg) translate(6%, 5%); } }
    @keyframes auroraBand2 { to { transform: rotate(13deg) translate(-7%, -5%); } }
    @keyframes auroraBand3 { to { transform: rotate(-9deg) translate(-5%, 6%); } }
    @keyframes auroraBand4 { to { transform: rotate(18deg) translate(5%, -6%); } }
    @keyframes auroraHue { 0%, 100% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(28deg); } }
    /* במצב בהיר — פסים עדינים במקום screen (שדורש רקע כהה) */
    :root[data-theme='light'] .aurora-band { opacity: 0.35; mix-blend-mode: normal; }
    /* כפתור ופאנל בחירת הרקע */
    .bg-picker-wrap { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .bg-btn {
      display: inline-flex; align-items: center; gap: 7px;
      background: transparent; border: 1px dashed var(--border-strong);
      color: var(--muted); border-radius: 999px; padding: 8px 18px;
      font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .bg-btn:hover { color: var(--text); border-color: var(--accent); background: rgba(123, 107, 255, 0.1); }
    .bg-btn .icon { width: 15px; height: 15px; }
    .bg-picker {
      background: var(--b-panel);
      border: 1px solid var(--b-border);
      border-radius: 18px;
      padding: 14px 14px 12px;
      box-shadow: var(--b-shadow);
      backdrop-filter: blur(18px) saturate(1.15);
      min-width: 260px;
      animation: bgFade 0.22s var(--ease, ease);
    }
    .bg-picker-title { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 10px; text-align: center; }
    .bg-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .bg-option {
      display: flex; align-items: center; gap: 8px;
      background: var(--b-count-bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 12px; padding: 8px 10px;
      font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .bg-option:hover { border-color: var(--accent); transform: scale(1.03); }
    .bg-option.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(123, 107, 255, 0.25); }
    .bg-option .chip { width: 26px; height: 18px; border-radius: 6px; flex-shrink: 0; border: 1px solid rgba(255, 255, 255, 0.14); }
    .chip-blobs { background: radial-gradient(circle at 30% 30%, #fb7185, #7b6bff); }
    .chip-fluid { background: linear-gradient(135deg, #34d399, #7b6bff, #fb7185); }
    .chip-particles { background: radial-gradient(circle, #f2f3ff 1px, transparent 2px) 0 0/10px 10px, #141428; }
    .chip-aurora { background: linear-gradient(135deg, #7b6bff, #34d399); }
    @keyframes bgFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body data-bg="blobs">
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="bg-blob blob-4"></div>
  <canvas id="fluidCanvas" class="bg-layer"></canvas>
  <canvas id="particleCanvas" class="bg-layer"></canvas>
  <div class="bg-layer aurora-layer">
    <div class="aurora-band aurora-band-1"></div>
    <div class="aurora-band aurora-band-2"></div>
    <div class="aurora-band aurora-band-3"></div>
    <div class="aurora-band aurora-band-4"></div>
  </div>

  <!-- כפתור המזעור מקובע מחוץ לחלונית — נשאר נגיש תמיד, גם כשצריך לגלול בחלונית -->
  <button class="minimize-btn" id="minimizeBtn" type="button" title="מזעור — רק הרקע במסך מלא">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <div class="block-screen" id="blockScreen">
    <div class="block-icon">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="block-title">המחשב חסום</div>
    <div class="block-sub">בשעות אלו אסור להשתמש במחשב על פי לוח הזמנים</div>
    <div class="block-msg" id="blockMsg"></div>
    <!-- שלושת השעונים: נוכחי / פתיחה / נשאר עד הפתיחה -->
    <div class="clocks">
      <div class="clock-card">
        <div class="clock-label">השעה עכשיו</div>
        <div id="clockNowFace"></div>
        <div class="clock-value" id="clockNow">--:--:--</div>
      </div>
      <div class="clock-card">
        <div class="clock-label">שעת הפתיחה</div>
        <div id="clockOpenFace"></div>
        <div class="clock-value" id="clockOpen">--:--</div>
      </div>
      <div class="clock-card">
        <div class="clock-label">הזמן הנותר</div>
        <div id="clockLeftFace"></div>
        <div class="clock-value" id="clockLeft">--:--:--</div>
      </div>
    </div>
    <div class="block-count" id="countdown"></div>
    <!-- משפטי עידוד מחזקים מהמקורות — מתחלפים מדי כמה שניות -->
    <div class="torah-quote" id="torahQuote">
      <div class="tq-text" id="tqText"></div>
      <div class="tq-source" id="tqSource"></div>
    </div>
    <!-- כפתור קטן ושקט לפתיחה בסיסמה — מיועד למקרי חירום בלבד,
         ולכן שדה הסיסמה מוסתר ומוצג רק בלחיצה על הכפתור -->
    <button class="unlock-toggle" id="pinToggle" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
      פתיחה בסיסמת ההורה
    </button>
    <div class="pin-box" id="pinBox" style="display:none">
      <input type="password" id="pinInput" class="text-input" placeholder="סיסמה להורה" autocomplete="off" />
      <br />
      <button class="btn btn-primary" id="pinBtn">פתח עכשיו</button>
      <br />
      <button class="btn btn-ghost btn-sm" id="forgotBtn">שכחתי סיסמה — שלחו למייל</button>
    </div>
    <div class="pin-box" id="noPinBox" style="display:none">
      <div class="no-pin-note">עוד לא הוגדרה סיסמה</div>
      <div class="no-pin-sub">החסימה אינה פעילה עד שמגדירים סיסמה — כדי שלא תהיה נעילה בלי מוצא. פתחו את ההגדרות והגדירו סיסמה.</div>
      <br />
      <button class="btn btn-primary" id="openSettingsBtn">פתחו את ההגדרות — הגדרת סיסמה</button>
      <br />
      <button class="btn btn-ghost btn-sm" id="skipPinBtn">פתח את המחשב עכשיו</button>
    </div>
    <div class="lock-msg" id="lockMsg"></div>
    <div class="hint-lock">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      פתיחה בסיסמת ההורה מיועדת למקרי חירום בלבד
    </div>

    <!-- בחירת רקע למסך החסימה -->
    <div class="bg-picker-wrap">
      <button class="bg-btn" id="bgToggle" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.7-.77 1.7-1.7 0-.45-.18-.87-.46-1.18-.28-.31-.46-.73-.46-1.18a1.7 1.7 0 0 1 1.7-1.7H16a6 6 0 0 0 6-6c0-4.42-4.48-8-10-8z"/></svg>
        רקע
      </button>
      <div class="bg-picker hidden" id="bgPicker">
        <div class="bg-picker-title">רקע למסך החסימה</div>
        <div class="bg-options">
          <button class="bg-option" data-bg="blobs" type="button"><span class="chip chip-blobs"></span>כתמים</button>
          <button class="bg-option" data-bg="fluid" type="button"><span class="chip chip-fluid"></span>נוזל</button>
          <button class="bg-option" data-bg="particles" type="button"><span class="chip chip-particles"></span>חלקיקים</button>
          <button class="bg-option" data-bg="aurora" type="button"><span class="chip chip-aurora"></span>זוהר</button>
        </div>
      </div>
    </div>
  </div>

  <!-- כפתור צף קטן — מופיע כשהחלונית ממוזערת, כדי לחזור אליה בלי להפריע לרקע -->
  <button class="restore-fab hidden" id="restoreFab" type="button" title="הצגת חלונית החסימה">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>המחשב חסום</span>
  </button>

  <script src="../scheduler.js"></script>
  <script src="torah-quotes.js"></script>
  <script src="vendor/webgl-fluid-simulation.js"></script>
  <script>
    const T = window.TimeScheduler;
    const API = window.electronAPI;
    const countdown = document.getElementById('countdown');
    const pinInput = document.getElementById('pinInput');
    const pinBox = document.getElementById('pinBox');
    const pinToggle = document.getElementById('pinToggle');
    const lockMsg = document.getElementById('lockMsg');
    const blockMsg = document.getElementById('blockMsg');

    /* ---------- משפטי עידוד מחזקים מהמקורות ----------
       כל משפט הוא ציטוט מדויק מתוך התנ"ך, המשנה או התלמוד.
       המשפטים מתחלפים כל 25 שניות ללא חזרה עד שמסתיים הסיבוב. */
    const tqText = document.getElementById('tqText');
    const tqSource = document.getElementById('tqSource');
    const tqBox = document.getElementById('torahQuote');
    let tqOrder = null; // סדר המשפטים המעורבב (כל משפט מוצג פעם אחת בסיבוב)
    function tqShuffle() {
      tqOrder = window.TORAH_QUOTES.map((_, i) => i);
      for (let i = tqOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = tqOrder[i]; tqOrder[i] = tqOrder[j]; tqOrder[j] = tmp;
      }
    }
    function showNextQuote() {
      if (!window.TORAH_QUOTES || !window.TORAH_QUOTES.length) {
        tqBox.classList.add('tq-hidden');
        return;
      }
      if (!tqOrder || !tqOrder.length) tqShuffle();
      const q = window.TORAH_QUOTES[tqOrder.pop()];
      tqText.textContent = q.t;
      tqSource.textContent = q.s;
      tqBox.classList.remove('tq-fade-in');
      void tqBox.offsetWidth; // אתחול האנימציה מחדש
      tqBox.classList.add('tq-fade-in');
    }
    showNextQuote();
    setInterval(showNextQuote, 25000);
    let lockUntil = 0; // אם במצב נעילה זמנית — מתי היא מסתיימת
    let pinExpanded = false; // המשתמש לחץ על "פתיחה בסיסמת ההורה"

    /* ---------- שלושת השעונים ----------
       השעון החי מבוסס על הזמן המהימן שהתהליך הראשי שולח (status.now) — כך
       ששינוי שעון המערכת לא משנה את התצוגה. בכל רענון סטטוס נשמר
       baseTrusted/baseWall, וביניהם מתקתקים באופן מקומי. */
    let baseTrusted = 0;
    let baseWall = 0;
    let openTs = 0; // מועד הפתיחה (אפס = לא ידוע / נעילה ידנית / ללא הגבלה)

    function pt(cx, cy, r, deg) {
      const rad = ((deg - 90) * Math.PI) / 180;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    }
    function handLine(cx, cy, r, deg, cls) {
      const p = pt(cx, cy, r, deg);
      return '<line class="' + cls + '" x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(2) + '" y2="' + p[1].toFixed(2) + '"/>';
    }
    // פני שעון אנלוגי (SVG) — שעה/דקה/שנייה.
    // הפנים דקורטיביים (הערך הדיגיטלי מופיע מתחת) — מוסתרים מהקורא המסך.
    function clockFaceSVG(h, m, s) {
      const cx = 50, cy = 50;
      let out = '<svg class="clock-face" viewBox="0 0 100 100" aria-hidden="true">';
      out += '<circle class="cf-ring" cx="50" cy="50" r="46"/>';
      for (let i = 0; i < 12; i++) {
        const a = pt(cx, cy, 42, i * 30);
        const b = pt(cx, cy, 46, i * 30);
        out += '<line class="cf-tick' + (i % 3 === 0 ? ' major' : '') + '" x1="' + a[0].toFixed(2) + '" y1="' + a[1].toFixed(2) + '" x2="' + b[0].toFixed(2) + '" y2="' + b[1].toFixed(2) + '"/>';
      }
      out += handLine(cx, cy, 24, ((h % 12) + m / 60) * 30, 'cf-hand cf-hour');
      out += handLine(cx, cy, 35, (m + s / 60) * 6, 'cf-hand cf-minute');
      out += handLine(cx, cy, 40, s * 6, 'cf-hand cf-second');
      out += '<circle class="cf-cap" cx="50" cy="50" r="2.2"/>';
      out += '</svg>';
      return out;
    }
    // פנים ריקים — טבעת וסימנים בלבד, ללא מחוגים (כך "—" לא נראה כמו 12:00)
    function emptyFace() {
      const cx = 50, cy = 50;
      let out = '<svg class="clock-face" viewBox="0 0 100 100" aria-hidden="true">';
      out += '<circle class="cf-ring" cx="50" cy="50" r="46"/>';
      for (let i = 0; i < 12; i++) {
        const a = pt(cx, cy, 42, i * 30);
        const b = pt(cx, cy, 46, i * 30);
        out += '<line class="cf-tick' + (i % 3 === 0 ? ' major' : '') + '" x1="' + a[0].toFixed(2) + '" y1="' + a[1].toFixed(2) + '" x2="' + b[0].toFixed(2) + '" y2="' + b[1].toFixed(2) + '"/>';
      }
      out += '</svg>';
      return out;
    }
    const pad2 = (n) => String(n).padStart(2, '0');
    function fmtClockTime(ms) {
      const d = new Date(ms);
      return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }
    function fmtClockHM(ms) {
      const d = new Date(ms);
      return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }
    function fmtRemaining(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return (h > 99 ? h : pad2(h)) + ':' + pad2(m) + ':' + pad2(s);
    }
    function trustedNowLive() {
      return baseTrusted ? baseTrusted + (Date.now() - baseWall) : Date.now();
    }
    // תקתוק חי: השעון הנוכחי והספירה לאחור מתעדכנים כל שנייה
    function tickClocks() {
      const now = trustedNowLive();
      const d = new Date(now);
      document.getElementById('clockNow').textContent = fmtClockTime(now);
      document.getElementById('clockNowFace').innerHTML = clockFaceSVG(d.getHours(), d.getMinutes(), d.getSeconds());
      if (openTs > 0) {
        const rem = Math.max(0, Math.round((openTs - now) / 1000));
        document.getElementById('clockLeft').textContent = fmtRemaining(rem);
        document.getElementById('clockLeftFace').innerHTML = clockFaceSVG(Math.floor(rem / 3600), Math.floor((rem % 3600) / 60), rem % 60);
      }
    }
    setInterval(tickClocks, 1000);
    function setOpenClock(ts) {
      openTs = ts;
      const openEl = document.getElementById('clockOpen');
      const openFace = document.getElementById('clockOpenFace');
      if (ts > 0) {
        const od = new Date(ts);
        openEl.textContent = fmtClockHM(ts);
        openFace.innerHTML = clockFaceSVG(od.getHours(), od.getMinutes(), 0);
      } else {
        openEl.textContent = '—';
        openFace.innerHTML = emptyFace();
      }
    }

    // החלת ערכת הנושא (בהיר/כהה) שהתהליך הראשי שולח במצב
    function applyBlockTheme(theme) {
      if (theme) document.documentElement.dataset.theme = theme;
    }

    const noPinBox = document.getElementById('noPinBox');

    // הרחבת שדה הסיסמה בלחיצה על הכפתור הקטן (מצב חירום)
    pinToggle.addEventListener('click', () => {
      pinExpanded = true;
      pinToggle.style.display = 'none';
      pinBox.style.display = '';
      pinInput.value = ''; // לעולם לא להשאיר סיסמה בשדה
      setTimeout(() => pinInput.focus(), 40);
    });

    /* ---------- רקעים למסך החסימה ----------
       ארבעה רקעים לבחירה (כפתור "רקע"):
       - blobs     — הכתמים המונפשים המוכרים (ברירת המחדל)
       - fluid     — סימולציית נוזלי WebGL (PavelDoGreat, MIT) — מגיבה לעכבר
       - particles — שדה חלקיקים על קנבס קל — מגיב לעכבר
       - aurora    — זוהר צבעוני מונפש (CSS בלבד — קל במיוחד לריבוי מסכים) */
    const fluidCanvas = document.getElementById('fluidCanvas');
    const particleCanvas = document.getElementById('particleCanvas');
    let activeBg = null;
    let stopParticles = null;

    function stopCurrentBg() {
      if (window.stopWebGLFluidSimulation) window.stopWebGLFluidSimulation();
      if (stopParticles) { stopParticles(); stopParticles = null; }
    }

    // שדה חלקיקים קל: כוכבים שנמשכים לעכבר ומתחברים בקווים לקרובים
    function startParticlesBg(canvas) {
      const ctx = canvas.getContext('2d');
      if (!ctx) return null;
      let w = 0, h = 0, raf = null;
      let stars = [];
      const mouse = { x: -9999, y: -9999 };
      const COUNT = Math.max(50, Math.min(140, Math.round((window.innerWidth * window.innerHeight) / 26000)));
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        w = canvas.clientWidth; h = canvas.clientHeight;
        canvas.width = Math.max(1, Math.round(w * dpr));
        canvas.height = Math.max(1, Math.round(h * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function initStars() {
        stars = Array.from({ length: COUNT }, () => ({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
          r: Math.random() * 1.8 + 0.6,
          c: 'hsla(' + (210 + Math.random() * 150) + ', 85%, 72%, 0.9)'
        }));
      }
      function step() {
        ctx.clearRect(0, 0, w, h);
        for (const s of stars) {
          const dx = mouse.x - s.x, dy = mouse.y - s.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < 90000 && d2 > 1) {
            const d = Math.sqrt(d2);
            s.vx += (dx / d) * 0.14;
            s.vy += (dy / d) * 0.14;
          }
          s.vx *= 0.985; s.vy *= 0.985;
          s.x += s.vx; s.y += s.vy;
          if (s.x < -10) s.x = w + 10; else if (s.x > w + 10) s.x = -10;
          if (s.y < -10) s.y = h + 10; else if (s.y > h + 10) s.y = -10;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = s.c;
          ctx.fill();
        }
        ctx.lineWidth = 0.6;
        for (let i = 0; i < stars.length; i++) {
          for (let j = i + 1; j < stars.length; j++) {
            const a = stars[i], b = stars[j];
            const dx = a.x - b.x, dy = a.y - b.y;
            if (dx * dx + dy * dy < 12100) {
              ctx.strokeStyle = 'rgba(123, 107, 255, 0.22)';
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            }
          }
        }
        raf = requestAnimationFrame(step);
      }
      const onMove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
      canvas.addEventListener('mousemove', onMove);
      resize(); initStars(); step();
      return () => {
        if (raf) cancelAnimationFrame(raf);
        canvas.removeEventListener('mousemove', onMove);
        ctx.clearRect(0, 0, w, h);
      };
    }

    function applyBg(bg) {
      if (!bg || bg === activeBg) return;
      stopCurrentBg();
      activeBg = bg;
      document.body.dataset.bg = bg;
      document.querySelectorAll('.bg-option').forEach((o) => o.classList.toggle('active', o.dataset.bg === bg));
      if (bg === 'fluid' && window.initWebGLFluidSimulation) {
        // הגדרות קלות יותר לריבוי מסכים; שקוף כדי שערכת הנושא תראה דרכו
        window.initWebGLFluidSimulation(fluidCanvas, {
          DYE_RESOLUTION: 512,
          SIM_RESOLUTION: 96,
          TRANSPARENT: true,
          BLOOM: true,
          SUNRAYS: true,
          SPLAT_RADIUS: 0.4,
          SPLAT_FORCE: 5000,
          CURL: 25,
          COLOR_UPDATE_SPEED: 8
        });
      } else if (bg === 'particles') {
        stopParticles = startParticlesBg(particleCanvas);
      }
    }

    // בורר הרקעים — בחירה נשמרת בהגדרות (block:set-bg) ומוחלת בכל המסכים
    const bgToggle = document.getElementById('bgToggle');
    const bgPicker = document.getElementById('bgPicker');
    bgToggle.addEventListener('click', () => {
      bgPicker.classList.toggle('hidden');
    });
    document.querySelectorAll('.bg-option').forEach((o) => {
      o.addEventListener('click', async () => {
        const bg = o.dataset.bg;
        bgPicker.classList.add('hidden');
        applyBg(bg);
        if (API && API.setBlockBg) API.setBlockBg(bg);
      });
    });
    // סגירת הבורר בלחיצה מחוצה לו
    document.addEventListener('click', (e) => {
      if (!bgPicker.classList.contains('hidden') &&
          !bgPicker.contains(e.target) && !bgToggle.contains(e.target)) {
        bgPicker.classList.add('hidden');
      }
    });

    /* ---------- מזעור החלונית ----------
       כפתור קטן בפינת הכרטיס מסתיר את כל החלונית (הכותרת, השעונים והכניסה
       בסיסמה) כך שהרקע לבדו תופס את כל המסך — למשל כדי לשחק עם הרקעים
       האינטראקטיביים. כפתור צף קטן בפינה חוזר לחלונית המלאה. */
    const blockScreen = document.getElementById('blockScreen');
    const restoreFab = document.getElementById('restoreFab');
    const minimizeBtn = document.getElementById('minimizeBtn');
    function setMinimized(min) {
      document.body.classList.toggle('block-minimized', min);
      restoreFab.classList.toggle('hidden', !min);
    }
    minimizeBtn.addEventListener('click', () => {
      setMinimized(true);
      if (bgPicker && !bgPicker.classList.contains('hidden')) bgPicker.classList.add('hidden');
    });
    restoreFab.addEventListener('click', () => setMinimized(false));
    // השחזור עובד גם עם Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('block-minimized')) {
        setMinimized(false);
      }
    });

    function render(status) {
      if (!status) return;
      applyBlockTheme(status.theme);
      applyBg(status.blockBg);
      // משפטי העידוד מהמקורות — ניתנים להסתרה מההגדרות (showTorahQuotes)
      tqBox.classList.toggle('tq-hidden', status.showTorahQuotes === false);
      // ללא סיסמה מוגדרת — מסך החסימה מציע דרך החוצה במקום שדה סיסמה
      if (status.pinSet === false) {
        pinBox.style.display = 'none';
        pinToggle.style.display = 'none';
        noPinBox.style.display = '';
      } else {
        // עם סיסמה — שדה הפתיחה מוסתר ומוצג רק בלחיצה על הכפתור
        noPinBox.style.display = 'none';
        pinToggle.style.display = pinExpanded ? 'none' : '';
        pinBox.style.display = pinExpanded ? '' : 'none';
      }
      // הודעה אישית שהוגדרה על ידי ההורה (מוצגת גם במנעול ידני)
      if (status.blockMessage && (status.state === 'blocked' || status.manualLock)) {
        blockMsg.textContent = status.blockMessage;
        blockMsg.style.display = '';
      } else {
        blockMsg.style.display = 'none';
      }
      // עדכון בסיס הזמן המהימן (מהתהליך הראשי) — השעון מתקתק בין הרענונים
      if (status.now) { baseTrusted = status.now; baseWall = Date.now(); }
      // נעילה ידנית (כפתור "נעל עכשיו") — המצב הלוגי נשאר מותר בלוח, אך המסך חסום
      if (status.state !== 'blocked' && !status.manualLock) {
        setOpenClock(0);
        document.getElementById('clockLeft').textContent = '—';
        document.getElementById('clockLeftFace').innerHTML = emptyFace();
        countdown.textContent = 'הגישה שוחררה';
        tickClocks();
        return;
      }
      if (status.manualLock) {
        // אין מועד פתיחה ידוע — הנעילה נפתחת רק עם סיסמת ההורה
        setOpenClock(0);
        document.getElementById('clockLeft').textContent = '—';
        document.getElementById('clockLeftFace').innerHTML = emptyFace();
        countdown.textContent = 'נעילה ידנית — הזינו סיסמה לפתיחה';
      } else if (status.nextAt) {
        setOpenClock(new Date(status.nextAt).getTime());
        // שמירה על פורמט העברית אם scheduler.js נטען; אחרת פורמט מספרי
        countdown.textContent = 'הגישה תיפתח ' + (status.secondsUntilLabel ||
          (T && typeof T.formatDuration === 'function'
            ? T.formatDuration(status.secondsUntilNext)
            : fmtRemaining(status.secondsUntilNext)));
      } else {
        setOpenClock(0);
        document.getElementById('clockLeft').textContent = '—';
        document.getElementById('clockLeftFace').innerHTML = emptyFace();
        countdown.textContent = 'חסום ללא הגבלת זמן לפי הלוח';
      }
      tickClocks();
      // ספירה לאחור של נעילה זמנית (אחרי 5 ניסיונות שגויים)
      const remain = lockUntil - Date.now();
      if (remain > 0) {
        pinBox.classList.add('locked');
        lockMsg.classList.remove('ok');
        lockMsg.innerHTML = 'נעילה זמנית — נסו שוב בעוד <span class="lock-count">' + Math.ceil(remain / 1000) + '</span> שניות';
      }
    }

    function showError(msg) {
      lockMsg.textContent = msg || 'סיסמה שגויה, נסו שוב';
      lockMsg.classList.remove('ok');
      pinInput.classList.remove('shake');
      void pinInput.offsetWidth; // הפעלת האנימציה מחדש
      pinInput.classList.add('shake');
      pinInput.value = '';
    }

    function lockTemporarily(seconds) {
      lockUntil = Date.now() + (seconds || 60) * 1000;
      pinBox.classList.add('locked');
      const iv = setInterval(() => {
        const remain = lockUntil - Date.now();
        if (remain <= 0) {
          clearInterval(iv);
          pinBox.classList.remove('locked');
          lockMsg.textContent = '';
        } else {
          lockMsg.innerHTML = 'נעילה זמנית — נסו שוב בעוד <span class="lock-count">' + Math.ceil(remain / 1000) + '</span> שניות';
        }
      }, 500);
    }

    if (API) {
      API.onStatus(render);
      setInterval(async () => render(await API.getStatus()), 1000);

      document.getElementById('pinBtn').onclick = async () => {
        if (!pinInput.value) return;
        const res = await API.unlockNow(pinInput.value);
        if (!res.ok) {
          if (res.locked) {
            lockTemporarily(res.locked);
          } else {
            showError(res.error);
          }
        } else {
          pinInput.value = ''; // הסיסמה נמחקת מיד אחרי הכניסה
          lockMsg.textContent = 'נפתח — הגישה שוחררה עד המעבר הבא';
          lockMsg.classList.add('ok');
        }
      };
      document.getElementById('openSettingsBtn').onclick = () => { if (API) API.openSettings(); };
      document.getElementById('skipPinBtn').onclick = async () => {
        const res = await API.unlockNow('');
        if (res && res.ok) {
          lockMsg.textContent = 'נפתח — הגישה שוחררה';
          lockMsg.classList.add('ok');
        } else {
          lockMsg.textContent = (res && res.error) || 'הפתיחה נכשלה';
          lockMsg.classList.remove('ok');
        }
      };
      document.getElementById('forgotBtn').onclick = async () => {
        lockMsg.textContent = 'שולח את הסיסמה למייל…';
        const res = await API.sendRecovery();
        if (res && res.ok) {
          lockMsg.textContent = 'הסיסמה נשלחה למייל המוגדר';
          lockMsg.classList.add('ok');
        } else {
          lockMsg.textContent = (res && res.error) || 'שליחה נכשלה — נדרשת גישה לאינטרנט';
          lockMsg.classList.remove('ok');
        }
      };
      pinInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('pinBtn').click();
      });
    } else {
      // ללא תהליך ראשי (למשל פתיחה ישירה בדפדפן) — מצב הדגמה עם נתונים
      // כדי שניתן יהיה לראות את השעונים עובדים.
      render({
        state: 'blocked',
        nextAt: new Date(Date.now() + 2 * 3600 * 1000 + 7 * 60 * 1000),
        secondsUntilNext: 2 * 3600 + 7 * 60,
        now: Date.now(),
        manualLock: false,
        pinSet: true,
        theme: 'dark',
        blockMessage: '',
        blockBg: 'blobs',
        showTorahQuotes: true
      });
    }
  </script>
</body>
</html>
