<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>סייר קבצים מוגבל — בין הזמנים</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a14; color: #e7e7f0;
      height: 100vh; display: flex; flex-direction: column;
    }
    header { padding: 14px 18px; border-bottom: 1px solid #23233a; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    .roots { display: flex; gap: 8px; flex-wrap: wrap; }
    .root-btn {
      background: #16162a; color: #cfcfe0; border: 1px solid #2a2a44; border-radius: 8px;
      padding: 6px 14px; cursor: pointer; font-size: 14px;
    }
    .root-btn.active { background: #7b6bff; color: #fff; border-color: #7b6bff; }
    .bar { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid #23233a; }
    .up-btn { background: #16162a; color: #cfcfe0; border: 1px solid #2a2a44; border-radius: 8px; padding: 5px 12px; cursor: pointer; }
    .up-btn:disabled { opacity: .4; cursor: default; }
    .crumb { color: #9a9ab5; font-size: 13px; word-break: break-all; }
    .ro-badge { margin-inline-start: auto; background: #3a2a2a; color: #ffb3b3; border-radius: 6px; padding: 3px 10px; font-size: 12px; }
    main { flex: 1; overflow: auto; padding: 8px 12px; }
    .row {
      display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; cursor: pointer;
    }
    .row:hover { background: #16162a; }
    .ico { min-width: 46px; text-align: center; font-size: 11px; color: #9a9ab5; }
    .row.dir .ico { color: #ffd479; }
    .nm { flex: 1; font-size: 14px; }
    .meta { color: #6d6d88; font-size: 12px; }
    .empty, .err { color: #9a9ab5; padding: 24px; text-align: center; }
    .err { color: #ffb3b3; }
  </style>
</head>
<body>
  <header>
    <h1>סייר קבצים מוגבל</h1>
    <div class="roots" id="roots"></div>
  </header>
  <div class="bar">
    <button class="up-btn" id="upBtn" disabled>למעלה</button>
    <span class="crumb" id="crumb"></span>
    <span class="ro-badge" id="roBadge" style="display:none">לקריאה בלבד</span>
  </div>
  <main id="list"></main>

  <script src="file-explorer.js"></script>
</body>
</html>
