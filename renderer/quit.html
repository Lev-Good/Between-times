<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>יציאה — בין הזמנים</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* משתני ערכת נושא — נקבעים לפי data-theme על ה-html (מגיע מהסטטוס) */
    :root {
      --q-bg: #0a0a14;
      --q-panel: rgba(20, 20, 40, 0.85);
      --q-border: rgba(255, 255, 255, 0.1);
      --q-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --q-title: linear-gradient(135deg, #fff, #fda4af);
      --q-input-bg: rgba(255, 255, 255, 0.05);
      --q-blob-opacity: 0.5;
      /* טוקנים גלובליים — מוגדרים כאן כדי שהחלון יהיה עצמאי ולא תלוי ב-styles.css */
      --text: #f2f3ff;
      --muted: #9aa0c3;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #7b6bff;
      --accent-2: #a78bfa;
      --red: #fb7185;
      --red-bg: rgba(251, 113, 133, 0.12);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    :root[data-theme='light'] {
      --q-bg: #eef0f9;
      --q-panel: rgba(255, 255, 255, 0.88);
      --q-border: rgba(23, 26, 70, 0.12);
      --q-shadow: 0 30px 80px rgba(40, 45, 110, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      --q-title: linear-gradient(135deg, #1b1d33, #e04257);
      --q-input-bg: rgba(255, 255, 255, 0.92);
      --q-blob-opacity: 0.15;
      --text: #1b1d33;
      --muted: #62668f;
      --border: rgba(23, 26, 70, 0.1);
      --border-strong: rgba(23, 26, 70, 0.18);
      --accent: #6358f0;
      --accent-2: #7c5cf0;
      --red: #e04257;
      --red-bg: rgba(224, 66, 87, 0.1);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    body {
      min-height: 100vh;
      display: grid; place-items: center;
      background: var(--q-bg);
      user-select: none;
      overflow: hidden;
      font-family: "Heebo", "Segoe UI", "Arial Hebrew", system-ui, sans-serif;
      transition: background 0.4s ease;
      padding: 28px;
      box-sizing: border-box;
      -webkit-app-region: drag; /* החלון חסר מסגרת — גרירה מהרקע מזיזה אותו */
    }
    .bg-blob {
      position: fixed; border-radius: 50%; filter: blur(90px); opacity: var(--q-blob-opacity);
      z-index: 0; pointer-events: none;
    }
    .blob-1 { width: 420px; height: 420px; top: -180px; right: -120px;
      background: radial-gradient(circle, rgba(251, 113, 133, 0.5), transparent 70%); }
    .blob-2 { width: 380px; height: 380px; bottom: -160px; left: -100px;
      background: radial-gradient(circle, rgba(123, 107, 255, 0.5), transparent 70%); }

    .quit-screen {
      position: relative; z-index: 1;
      text-align: center; width: 100%; max-width: 360px;
      padding: 30px 28px;
      box-sizing: border-box;
      background: var(--q-panel);
      border: 1px solid var(--q-border);
      border-radius: 26px;
      backdrop-filter: blur(16px) saturate(1.15);
      box-shadow: var(--q-shadow);
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
      /* הגנה למסכים קטנים במיוחד — אם גודל החלון לא מספיק, גלילה פנימית */
      max-height: calc(100vh - 56px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
      -webkit-app-region: drag;
    }
    .quit-screen::-webkit-scrollbar { width: 8px; }
    .quit-screen::-webkit-scrollbar-track { background: transparent; }
    .quit-screen::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    /* שדה הקלט והכפתורים ניתנים ללחיצה — לא לגרירה */
    input, button { -webkit-app-region: no-drag; }
    .quit-icon {
      width: 64px; height: 64px; margin: 0 auto 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, #fb7185, #e11d48);
      display: grid; place-items: center;
      box-shadow: 0 12px 36px rgba(251, 113, 133, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.3);
    }
    .quit-icon .icon { width: 32px; height: 32px; color: #fff; }
    .quit-title {
      font-size: 26px; font-weight: 900; letter-spacing: -0.3px;
      background: var(--q-title);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .quit-sub { color: var(--muted); font-size: 14px; margin-top: 8px; line-height: 1.7; }
    .quit-warn {
      display: flex; align-items: center; gap: 8px;
      margin-top: 14px; padding: 9px 12px;
      background: var(--red-bg); color: #fda4af;
      border: 1px solid rgba(251, 113, 133, 0.35);
      border-radius: 11px;
      font-size: 12.5px; font-weight: 600; line-height: 1.5;
      text-align: right;
    }
    .quit-warn .icon { width: 15px; height: 15px; flex-shrink: 0; }
    .quit-input {
      width: 100%; margin-top: 16px;
      background: var(--q-input-bg);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-family: inherit; font-size: 18px; text-align: center;
      letter-spacing: 6px;
      transition: border-color 0.2s var(--ease, ease), box-shadow 0.2s var(--ease, ease), background 0.4s ease;
    }
    .quit-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(123, 107, 255, 0.25);
    }
    .quit-actions { display: flex; gap: 10px; margin-top: 14px; }
    .quit-actions .btn { flex: 1; }
    .quit-msg { color: var(--muted); font-size: 12.5px; margin-top: 16px; line-height: 1.6; }
    .shake { animation: shakeX 0.45s ease; }
    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(9px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(5px); }
    }
    .locked { opacity: 0.55; pointer-events: none; }
    /* ---------- חלונית יציאה בשפה של ממשק הניהול ---------- */
    body::before, body::after { display: none; }
    body {
      background:
        radial-gradient(520px 360px at 86% 0%, rgba(224, 66, 87, .12), transparent 68%),
        radial-gradient(520px 360px at 4% 100%, rgba(51, 127, 178, .14), transparent 68%),
        #f4f7fb;
    }
    :root[data-theme='light'] {
      color-scheme: light;
      --q-bg: #f4f7fb;
      --q-panel: rgba(255,255,255,.97);
      --q-border: #d5dee8;
      --q-shadow: 0 24px 64px rgba(31,52,78,.18), 0 2px 8px rgba(31,52,78,.06);
      --q-title: none;
      --q-input-bg: #fff;
      --text: #172238;
      --muted: #68768b;
      --border: #e1e7ef;
      --border-strong: #b8c7d7;
      --accent: #337fb2;
      --accent-2: #26719f;
      --red: #c83e4d;
      --red-bg: #fff0f1;
    }
    :root[data-theme='light'] .quit-screen {
      max-width: 430px;
      padding: 34px 36px 30px;
      border-radius: 22px;
      backdrop-filter: blur(8px);
    }
    :root[data-theme='light'] .quit-icon {
      width: 76px; height: 76px; margin-bottom: 20px;
      border-radius: 22px;
      background: linear-gradient(145deg, #df5664, #bd3042);
      box-shadow: 0 12px 28px rgba(200,62,77,.28), inset 0 2px 0 rgba(255,255,255,.35);
    }
    :root[data-theme='light'] .quit-icon .icon { width: 37px; height: 37px; }
    :root[data-theme='light'] .quit-title {
      color: #172238; background: none; -webkit-text-fill-color: currentColor;
      font-size: 29px;
    }
    :root[data-theme='light'] .quit-sub { color: #68768b; font-size: 15px; }
    :root[data-theme='light'] .quit-warn {
      background: #fff8e6; border-color: #efd58a; color: #6e5a22;
    }
    :root[data-theme='light'] .quit-input {
      border-color: #b8c7d7; color: #172238; font-size: 19px;
      padding-block: 14px;
    }
    :root[data-theme='light'] .quit-input:focus { border-color: #337fb2; box-shadow: 0 0 0 3px rgba(51,127,178,.18); }
    :root[data-theme='light'] .quit-actions .btn-danger { background: #c83e4d; box-shadow: 0 7px 16px rgba(200,62,77,.2); }
    :root[data-theme='light'] .quit-actions .btn-ghost { color: #52657a; border-color: #c8d3df; background: #fff; }
    :root[data-theme='light'] .quit-actions .btn-ghost:hover { border-color: #337fb2; background: #eef6fb; }
    @media (max-width: 420px) {
      :root[data-theme='light'] .quit-screen { padding-inline: 22px; }
      :root[data-theme='light'] .quit-actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="quit-screen">
    <div class="quit-icon">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
    </div>
    <div class="quit-title">לצאת מהתוכנה?</div>
    <div class="quit-sub">היציאה תפסיק את אכיפת לוח הזמנים.<br />יש להזין את סיסמת ההורה כדי לצאת.</div>
    <div class="quit-warn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      <span>לאחר היציאה — התוכנה לא תחסום את המחשב עד להפעלה הבאה</span>
    </div>
    <input type="password" id="quitPin" class="quit-input" placeholder="סיסמת הורה" autofocus autocomplete="off" />
    <div class="quit-actions">
      <button class="btn btn-danger" id="quitOk">יציאה</button>
      <button class="btn btn-ghost" id="quitCancel">ביטול</button>
    </div>
    <div class="quit-msg" id="quitMsg"></div>
  </div>

  <script src="../scheduler.js"></script>
  <script>
    const T = window.TimeScheduler;
    const API = window.electronAPI;
    const pinInput = document.getElementById('quitPin');
    const msg = document.getElementById('quitMsg');
    let busy = false;

    // החלת ערכת הנושא (בהיר/כהה) שהתהליך הראשי שולח במצב
    function applyTheme(theme) {
      if (theme) document.documentElement.dataset.theme = theme;
    }

    function showError(txt) {
      msg.textContent = txt || '';
      msg.style.color = 'var(--red)';
      pinInput.classList.remove('shake');
      void pinInput.offsetWidth;
      pinInput.classList.add('shake');
      pinInput.value = '';
      pinInput.focus();
    }

    async function doQuit() {
      if (busy) return;
      const pin = pinInput.value;
      if (!pin) { showError('הזינו את סיסמת ההורה'); return; }
      busy = true;
      pinInput.classList.add('locked');
      const res = await API.quitApp(pin);
      // הצלחה = התהליך הראשי סוגר את התוכנה (החלון ייסגר ממילא)
      if (!res || !res.ok) {
        busy = false;
        pinInput.classList.remove('locked');
        showError((res && res.error) || 'סיסמה שגויה, נסו שוב');
      }
    }

    document.getElementById('quitOk').onclick = doQuit;
    document.getElementById('quitCancel').onclick = () => { if (API) API.quitCancel(); };
    pinInput.onkeydown = (e) => {
      if (e.key === 'Enter') doQuit();
      if (e.key === 'Escape' && API) API.quitCancel();
    };

    // התאמת גודל החלון לתוכן — החלון חסר מסגרת ולכן גודלו נקבע לפי הפאנל,
    // כך שכל ההודעה נראית תמיד, בהתאמה למסך (גם על מסכים קטנים).
    function fitWindow() {
      if (!API || !API.fitQuitWindow) return;
      const panel = document.querySelector('.quit-screen');
      if (!panel) return;
      // מודדים את הגובה הטבעי (בלי הגבלת ה-max-height) כדי שהחלון יקיף את כל התוכן
      const prevMax = panel.style.maxHeight;
      panel.style.maxHeight = 'none';
      const rect = panel.getBoundingClientRect();
      panel.style.maxHeight = prevMax;
      const margin = 56; // רווח סביב הפאנל (28px מכל צד — כולל הצל)
      let w = Math.ceil(rect.width) + margin;
      let h = Math.ceil(rect.height) + margin;
      // לא לעבור את גודל המסך הזמין (פחות שורת המשימות)
      const availW = window.screen.availWidth;
      const availH = window.screen.availHeight;
      if (w > availW) w = availW;
      if (h > availH) h = availH;
      API.fitQuitWindow(w, h);
    }
    // אחרי שהגופנים נטענו (הגובה יכול להשתנות) — ועם גיבוי לכל מקרה
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => setTimeout(fitWindow, 30));
    }
    setTimeout(fitWindow, 120);

    // אתחול: ערכת הנושא מהמצב הנוכחי
    if (API) {
      API.onStatus((st) => applyTheme(st && st.theme));
      API.getStatus().then((st) => applyTheme(st && st.theme));
    }
    setTimeout(() => pinInput.focus(), 60);
  </script>
</body>
</html>
